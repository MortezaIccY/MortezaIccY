<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="464" viewBox="0 0 1200 464">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0F1D33"/>
      <stop offset="1" stop-color="#0A1324"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0284C7"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="shineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#7DD3FC" stop-opacity="1"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <clipPath id="cardClip">
      <rect width="588" height="220" rx="18"/>
    </clipPath>
  </defs>

  <style>
    .font  { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .title { font-size: 24px; font-weight: 700; fill: #FFFFFF; }
    .tag   { font-size: 14px; font-weight: 500; fill: #38BDF8; }
    .desc  { font-size: 17px; fill: #94A3B8; }
    .num   { font-size: 34px; font-weight: 800; fill: #38BDF8; fill-opacity: 0.15; }
    .pill rect { fill: #0C2A43; stroke: #0EA5E9; stroke-opacity: 0.5; }
    .pill text { font-size: 14px; font-weight: 600; fill: #7DD3FC; text-anchor: middle; }
    .icon *    { fill: none; stroke: #FFFFFF; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .icon .dot { fill: #FFFFFF; stroke: none; }

    .card { animation: rise 0.8s ease-out both; }
    .c2 { animation-delay: 0.12s; }
    .c3 { animation-delay: 0.24s; }
    .c4 { animation-delay: 0.36s; }

    .glow  { animation: pulse 4s ease-in-out infinite alternate; }
    .shine { animation: shine 6s ease-in-out infinite; }
    .s2 { animation-delay: 1.5s; }
    .s3 { animation-delay: 3s; }
    .s4 { animation-delay: 4.5s; }

    @keyframes rise  { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pulse { from { opacity: 0.25; } to { opacity: 0.6; } }
    @keyframes shine { 0% { transform: translateX(0); } 50%, 100% { transform: translateX(910px); } }
  </style>

  <!-- 01 · Backend & APIs -->
  <g transform="translate(2 2)">
    <g class="card">
      <rect width="588" height="220" rx="18" fill="url(#cardBg)" stroke="#1E3A5F"/>
      <g clip-path="url(#cardClip)">
        <circle class="glow" cx="54" cy="54" r="34" fill="#38BDF8" filter="url(#blur)"/>
        <rect class="shine" x="-160" y="0" width="160" height="2" fill="url(#shineGrad)"/>
      </g>
      <rect x="28" y="28" width="52" height="52" rx="14" fill="url(#accent)"/>
      <g class="icon" transform="translate(42 42)">
        <rect x="3" y="3" width="18" height="7" rx="2"/>
        <rect x="3" y="14" width="18" height="7" rx="2"/>
        <circle class="dot" cx="7" cy="6.5" r="1.2"/>
        <circle class="dot" cx="7" cy="17.5" r="1.2"/>
        <line x1="11" y1="6.5" x2="17" y2="6.5"/>
        <line x1="11" y1="17.5" x2="17" y2="17.5"/>
      </g>
      <text class="font num" x="560" y="62" text-anchor="end">01</text>
      <text class="font title" x="100" y="52">Backend &amp; APIs</text>
      <text class="font tag" x="100" y="76">The core of every product</text>
      <text class="font desc" x="28" y="120">REST and GraphQL APIs, queues and background jobs,</text>
      <text class="font desc" x="28" y="144">authentication, and third-party integrations.</text>
      <g class="font pill">
        <rect x="28" y="164" width="84" height="30" rx="15"/><text x="70" y="184">Laravel</text>
        <rect x="120" y="164" width="66" height="30" rx="15"/><text x="153" y="184">REST</text>
        <rect x="194" y="164" width="90" height="30" rx="15"/><text x="239" y="184">GraphQL</text>
        <rect x="292" y="164" width="78" height="30" rx="15"/><text x="331" y="184">Queues</text>
      </g>
    </g>
  </g>

  <!-- 02 · Lua Scripting -->
  <g transform="translate(610 2)">
    <g class="card c2">
      <rect width="588" height="220" rx="18" fill="url(#cardBg)" stroke="#1E3A5F"/>
      <g clip-path="url(#cardClip)">
        <circle class="glow" cx="54" cy="54" r="34" fill="#38BDF8" filter="url(#blur)"/>
        <rect class="shine s2" x="-160" y="0" width="160" height="2" fill="url(#shineGrad)"/>
      </g>
      <rect x="28" y="28" width="52" height="52" rx="14" fill="url(#accent)"/>
      <g class="icon" transform="translate(42 42)">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </g>
      <text class="font num" x="560" y="62" text-anchor="end">02</text>
      <text class="font title" x="100" y="52">Lua Scripting</text>
      <text class="font tag" x="100" y="76">Fast logic for real-time systems</text>
      <text class="font desc" x="28" y="120">Custom scripting systems and server-side logic for</text>
      <text class="font desc" x="28" y="144">real-time environments where performance matters.</text>
      <g class="font pill">
        <rect x="28" y="164" width="54" height="30" rx="15"/><text x="55" y="184">Lua</text>
        <rect x="90" y="164" width="116" height="30" rx="15"/><text x="148" y="184">Server logic</text>
        <rect x="214" y="164" width="118" height="30" rx="15"/><text x="273" y="184">Optimization</text>
      </g>
    </g>
  </g>

  <!-- 03 · Databases -->
  <g transform="translate(2 242)">
    <g class="card c3">
      <rect width="588" height="220" rx="18" fill="url(#cardBg)" stroke="#1E3A5F"/>
      <g clip-path="url(#cardClip)">
        <circle class="glow" cx="54" cy="54" r="34" fill="#38BDF8" filter="url(#blur)"/>
        <rect class="shine s3" x="-160" y="0" width="160" height="2" fill="url(#shineGrad)"/>
      </g>
      <rect x="28" y="28" width="52" height="52" rx="14" fill="url(#accent)"/>
      <g class="icon" transform="translate(42 42)">
        <ellipse cx="12" cy="5" rx="9" ry="3"/>
        <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/>
        <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/>
      </g>
      <text class="font num" x="560" y="62" text-anchor="end">03</text>
      <text class="font title" x="100" y="52">Databases</text>
      <text class="font tag" x="100" y="76">Data that stays fast at scale</text>
      <text class="font desc" x="28" y="120">Schema design, indexing, and query optimization,</text>
      <text class="font desc" x="28" y="144">with Redis for caching and MongoDB for documents.</text>
      <g class="font pill">
        <rect x="28" y="164" width="78" height="30" rx="15"/><text x="67" y="184">MySQL</text>
        <rect x="114" y="164" width="66" height="30" rx="15"/><text x="147" y="184">Redis</text>
        <rect x="188" y="164" width="94" height="30" rx="15"/><text x="235" y="184">MongoDB</text>
      </g>
    </g>
  </g>

  <!-- 04 · Frontend -->
  <g transform="translate(610 242)">
    <g class="card c4">
      <rect width="588" height="220" rx="18" fill="url(#cardBg)" stroke="#1E3A5F"/>
      <g clip-path="url(#cardClip)">
        <circle class="glow" cx="54" cy="54" r="34" fill="#38BDF8" filter="url(#blur)"/>
        <rect class="shine s4" x="-160" y="0" width="160" height="2" fill="url(#shineGrad)"/>
      </g>
      <rect x="28" y="28" width="52" height="52" rx="14" fill="url(#accent)"/>
      <g class="icon" transform="translate(42 42)">
        <rect x="3" y="4" width="18" height="16" rx="2"/>
        <line x1="3" y1="9" x2="21" y2="9"/>
        <line x1="9" y1="9" x2="9" y2="20"/>
        <circle class="dot" cx="6" cy="6.5" r="0.9"/>
        <circle class="dot" cx="8.8" cy="6.5" r="0.9"/>
      </g>
      <text class="font num" x="560" y="62" text-anchor="end">04</text>
      <text class="font title" x="100" y="52">Frontend</text>
      <text class="font tag" x="100" y="76">Interfaces teams enjoy using</text>
      <text class="font desc" x="28" y="120">Admin panels and dashboards that are fast, clean,</text>
      <text class="font desc" x="28" y="144">and easy for teams to use every day.</text>
      <g class="font pill">
        <rect x="28" y="164" width="72" height="30" rx="15"/><text x="64" y="184">Vue.js</text>
        <rect x="108" y="164" width="72" height="30" rx="15"/><text x="144" y="184">Svelte</text>
        <rect x="188" y="164" width="120" height="30" rx="15"/><text x="248" y="184">Tailwind CSS</text>
      </g>
    </g>
  </g>
</svg>
