name: Update README cards

on:
  schedule:
    - cron: "0 0 * * *"   # once a day
  workflow_dispatch:       # lets you run it manually

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=transparent&hide_border=true&title_color=0EA5E9&icon_color=38BDF8&text_color=8B949E&ring_color=0EA5E9
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&exclude_repo=activity-log&theme=transparent&hide_border=true&title_color=0EA5E9&text_color=8B949E
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            profile/snake-dark.svg?palette=github-dark&color_snake=#38BDF8&color_dots=#161B22,#0C4A6E,#0369A1,#0EA5E9,#7DD3FC
            profile/snake-light.svg?palette=github-light&color_snake=#0369A1&color_dots=#EBEDF0,#BAE6FD,#7DD3FC,#38BDF8,#0284C7

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
